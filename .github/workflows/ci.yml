name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 会議アプリの検知が CoreAudio を、録音が PortAudio を読むため macOS で動かす
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests .agents
      - run: uv run pytest -q
