[project]
name = "scriba"
version = "1.0.0"
description = "オンライン会議を macOS でローカルに録音し、逐次文字起こしする CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Natural Language :: Japanese",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "icalendar>=7.3.0",
    "pyyaml>=6.0",
    "recurring-ical-events>=3.8.2",
    "sounddevice>=0.5",
    "soundfile>=0.12",
]

[project.scripts]
scriba = "scriba.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scriba"]

[tool.hatch.build.targets.sdist]
exclude = ["/z-ai/**", "/dist/**", "/.venv/**"]

[tool.ruff]
line-length = 110
extend-exclude = ["z-ai"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
